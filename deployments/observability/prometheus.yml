global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # App metrics. Requires stage 3 (GIGA_AGENT_METRICS_ENABLED=1) AND confirming
  # the actual /metrics path behind the aegra mount. Until then this target is
  # expected to be DOWN — that is not a stack failure.
  - job_name: giga-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["giga-agent:8000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres-aegra
    static_configs:
      - targets: ["postgres-exporter-aegra:9187"]

  - job_name: postgres-app
    static_configs:
      - targets: ["postgres-exporter-app:9187"]

  # Qdrant exposes Prometheus metrics natively at /metrics.
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]
