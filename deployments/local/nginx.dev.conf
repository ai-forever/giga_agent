map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream giga_backend {
    server giga-agent:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Ensure nginx handles compression (avoid upstream gzipping).
    proxy_set_header Accept-Encoding "";

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # UI/static compression. Avoid text/event-stream to prevent buffering issues.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm
        font/woff2;

    # Streaming / large responses can be sensitive to buffering.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Direct UI access.
    location = /ui {
        return 301 /ui/;
    }
    location ^~ /ui/ {
        proxy_pass http://giga_backend;
    }

    # Agent API direct access (if used by clients).
    location = /agent {
        return 301 /agent/;
    }
    location ^~ /agent/ {
        proxy_pass http://giga_backend;
    }

    # Convenience API mapping:
    # /api -> /
    # /api/agent -> /agent
    location = /api/agent {
        proxy_pass http://giga_backend/agent;
    }
    location ^~ /api/agent/ {
        proxy_pass http://giga_backend/agent/;
    }
    location = /api {
        proxy_pass http://giga_backend/;
    }
    location ^~ /api/ {
        proxy_pass http://giga_backend/;
    }

    # Root-level asset convenience (many UIs expect /assets/*).
    location ^~ /assets/ {
        proxy_pass http://giga_backend/ui/assets/;
    }
    location ^~ /static/ {
        proxy_pass http://giga_backend/ui/static/;
    }

    # Keep service endpoints accessible at root.
    location = /health {
        proxy_pass http://giga_backend/health;
    }
    location = /openapi.json {
        proxy_pass http://giga_backend/openapi.json;
    }
    location ^~ /docs {
        proxy_pass http://giga_backend/docs;
    }
    location ^~ /redoc {
        proxy_pass http://giga_backend/redoc;
    }

    # Default: serve UI under / without redirects.
    location = / {
        proxy_pass http://giga_backend/ui/;
    }
    location / {
        rewrite ^ /ui$uri break;
        proxy_pass http://giga_backend;
    }
}

