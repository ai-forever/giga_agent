map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream giga_backend {
    server giga-agent:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Serve precompressed assets when available.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm
        font/woff2;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Streaming / large responses can be sensitive to buffering.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Convenience API mapping (same idea as old dev config):
    # /api -> /
    # /api/agent -> /agent
    location = /api/agent {
        proxy_pass http://giga_backend/agent;
    }
    location ^~ /api/agent/ {
        proxy_pass http://giga_backend/agent/;
    }
    location = /api {
        proxy_pass http://giga_backend/;
    }
    location ^~ /api/ {
        proxy_pass http://giga_backend/;
    }

    location = /app-config.js {
        proxy_pass http://giga_backend/app-config.js;
    }

    # # External proxy endpoint used by MCP clients.
    # location ~ ^/proxy/(?<proto>https?|wss?):?/?/(?<dst_host>[^/]+)(?<dst_path>/.*)?$ {
    #     resolver 127.0.0.11 ipv6=off valid=60s;
    #     resolver_timeout 10s;

    #     set $upstream "$proto://$dst_host$dst_path$is_args$args";
    #     proxy_pass $upstream;

    #     proxy_set_header Host $dst_host;
    #     proxy_http_version 1.1;

    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;

    #     proxy_buffering off;
    #     proxy_request_buffering off;
    #     proxy_connect_timeout 5s;
    #     proxy_read_timeout 1h;
    #     proxy_send_timeout 1h;

    #     proxy_ssl_server_name on;
    #     proxy_ssl_name $dst_host;
    #     proxy_ssl_session_reuse on;
    # }

    # location ~ ^/\.well-known/(?<auth>[^/]+)/proxy/(?<proto>https?|wss?):?/?/(?<dst_host>[^/]+)(?<dst_path>/.*)?$ {
    #     resolver 127.0.0.11 ipv6=off valid=60s;
    #     resolver_timeout 10s;

    #     set $upstream "$proto://$dst_host/.well-known/$auth$is_args$args";
    #     proxy_pass $upstream;

    #     proxy_set_header Host $dst_host;
    #     proxy_http_version 1.1;

    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;

    #     proxy_buffering off;
