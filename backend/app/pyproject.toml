[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "giga-agent"
version = "0.1.0"
description = "Modular Agent Framework with Hybrid Database Support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mikhail Murtazin", email = "murtazkorpaz@gmail.com" }
]

# Основные зависимости
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "typer[all]>=0.9.0",
    "structlog>=24.0.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "langgraph==1.0.8",
    "langchain>=1.2.0",
    "langgraph-cli>=0.4.11",
    "websockets>=15.0.1",
    "aiohttp>=3.9.0",
    "docker>=7.1.0",
    "fastapi>=0.127.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "langgraph-api==0.7.28",
    "langchain-openai>=1.1.6",
    "langchain-tavily>=0.2.11",
    "langchain-gigachat-lc1>=0.4.0b4",
    "e2b>=2.13.2",
    "aioboto3>=15.5.0",
    "cashews[redis]>=7.0.0",
    "deepagents==0.0.5",
    "pydub>=0.25.1",
    "pillow>=12.1.1",
    "markdownify>=1.2.2",
    "genson>=1.3.0",
    "langchain-community>=0.4.1",
    "beautifulsoup4>=4.14.3",
    "pdfminer-six>=20260107",
    "lxml>=6.0.2",
    "unstructured[docx]>=0.18.32",
    "psycopg[binary]>=3.3.3",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.1",
    "langchain-postgres>=0.0.17",
    "langchain-qdrant>=1.1.0",
    "mem0ai>=0.1.115",
]

[project.scripts]
giga_agent = "giga_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["giga_agent"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    "ignore:.*'audioop' is deprecated and slated for removal in Python 3\\.13.*:DeprecationWarning",
]
