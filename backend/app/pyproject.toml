[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "giga-agent"
version = "0.1.0"
description = "Modular Agent Framework with Hybrid Database Support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mikhail Murtazin", email = "murtazkorpaz@gmail.com" }
]

# Основные зависимости
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "typer[all]>=0.9.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "langgraph==1.0.8",
    "langchain>=1.2.0",
    "langgraph-cli>=0.4.11",
    "websockets>=15.0.1",
    "aiohttp>=3.9.0",
    "docker>=7.1.0",
    "fastapi>=0.127.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "langgraph-api==0.7.28",
    "langchain-openai>=1.1.6",
    "langchain-tavily>=0.2.11",
    "langchain-gigachat-lc1>=0.4.0b4",
    "e2b>=2.13.2",
    "aioboto3>=15.5.0",
    "cashews[redis]>=7.0.0",
]

[project.scripts]
giga_agent = "giga_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["giga_agent"]
