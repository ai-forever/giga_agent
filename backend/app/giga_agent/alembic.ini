# A generic, single database configuration.

[alembic]
# path to migration scripts
# Using package syntax to find env.py inside the installed library
script_location = giga_agent:migrations

# template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Defaults (will be overridden by env vars or CLI)
sqlalchemy.url = sqlite+aiosqlite:///./local.db

# Dynamic handling of version locations happens in CLI
# But we can set a default empty one or point to a local 'migrations' folder
# if we want to allow user-defined migrations in the root without modules.
# version_locations = migrations

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

