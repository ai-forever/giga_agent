[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "giga-agent"
version = "0.1.9"
description = "Modular Agent Framework"
dynamic = ["readme"]
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mikhail Murtazin", email = "murtazkorpaz@gmail.com" }
]

# Основные зависимости
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "typer[all]~=0.24.1",
    "structlog>=24.0.0,<25.0.0",
    "pydantic[email]>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "aiosqlite~=0.21.0",
    "asyncpg~=0.30.0",
    "langgraph==1.0.8",
    "langchain>=1.2.0,<2.0.0",
    "langgraph-cli~=0.4.11",
    "websockets>=15.0.1,<16.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "docker>=7.1.0,<8.0.0",
    "fastapi~=0.127.0",
    "bcrypt>=4.0.0,<5.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "python-multipart~=0.0.9",
    "langgraph-api==0.7.28",
    "langgraph-prebuilt==1.0.7",
    "langchain-openai>=1.1.6,<2.0.0",
    "langchain-tavily~=0.2.11",
    "langchain-gigachat>=0.5.0",
    "e2b>=2.13.2,<3.0.0",
    "aioboto3>=15.5.0,<16.0.0",
    "cashews[redis]>=7.0.0,<8.0.0",
    "deepagents==0.4.0",
    "pydub~=0.25.1",
    "audioop-lts~=0.2.1; python_version>='3.13'",
    "pillow>=12.1.1,<13.0.0",
    "markdownify>=1.2.2,<2.0.0",
    "genson>=1.3.0,<2.0.0",
    "langchain-community~=0.4.1",
    "beautifulsoup4>=4.14.3,<5.0.0",
    "pdfminer-six>=20260107",
    "lxml>=6.0.2,<7.0.0",
    "psycopg[binary]>=3.3.3,<4.0.0",
    "httpx~=0.28.1",
    "langchain-text-splitters>=1.1.1,<2.0.0",
    "langchain-postgres==0.0.17",
    "langchain-qdrant>=1.1.0,<2.0.0",
    "scikit-learn==1.6.1",
    "aiofiles>=25.1.0,<26.0.0",
    "redis==7.2.1",
    "psycopg2-binary>=2.9.11,<3.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "plotly>=6.0.0,<7.0.0",
    "kaleido>=1.0.0,<2.0.0",
    "aiogram>=3.26.0,<4.0.0",
    "google-genai>=1.66.0,<2.0.0",
    "socksio~=1.0.0",
    "aiohttp-socks~=0.11.0",
    "langchain-deepseek~=1.0.1",
    "langgraph-checkpoint-sqlite>=3.0.3,<4.0.0",
    "prompt-toolkit>=3.0.52",
]

[project.scripts]
giga_agent = "giga_agent.cli:app"

[project.optional-dependencies]
jupyter = [
    "jupyter-server>=2.0.0",
    "ipykernel>=6.0.0",
    "pip>=25.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "openpyxl>=3.1.0",
    "sympy>=1.13.0",
    "python-docx>=1.1.0",
]
jupyter-full = [
    "jupyter-server>=2.0.0,<3.0.0",
    "ipykernel>=6.0.0,<7.0.0",
    "pip>=25.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "seaborn~=0.13.0",
    "openpyxl>=3.1.0,<4.0.0",
    "sympy>=1.13.0,<2.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "opencv-python>=4.11.0,<5.0.0",
    "librosa~=0.11.0",
    "spacy>=3.8.2,<4.0.0; python_version<'3.13'",
    "nltk>=3.9.0,<4.0.0",
    "xarray>=2025.0.0,<2026.0.0",
    "scikit-image~=0.25.0",
    "bokeh>=3.7.0,<4.0.0",
    "imageio>=2.37.0,<3.0.0",
    "soundfile~=0.13.0",
    "xlrd>=2.0.0,<3.0.0",
]

[tool.hatch.build.force-include]
"giga_agent/alembic.ini" = "giga_agent/alembic.ini"
"giga_agent/migrations/script.py.mako" = "giga_agent/migrations/script.py.mako"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata.hooks.custom]
path = "hatch_metadata.py"

[tool.hatch.build.targets.wheel]
packages = ["giga_agent"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/additional_data",
]

[tool.hatch.build.targets.sdist.force-include]
"../front/dist" = "giga_agent/ui_dist"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "ruff~=0.15.2",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    "ignore:.*'audioop' is deprecated and slated for removal in Python 3\\.13.*:DeprecationWarning",
]
