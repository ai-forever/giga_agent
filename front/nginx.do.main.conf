server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream;

    client_max_body_size 150M;
    keepalive_timeout 75s;

    set $connection_upgrade "";
    if ($http_upgrade != "") {
        set $connection_upgrade "upgrade";
    }

    # API proxy -> giga-agent-server (hyphenated name for DO App Platform)
    location /api/ {
        proxy_pass         http://giga-agent-server:8822/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    # Generic outbound proxy (MCP, external services)
    # Uses public DNS since targets are external hosts
    location ~ ^/proxy/(?<proto>https?|wss?):?/?/(?<dst_host>[^/]+)(?<dst_path>/.*)?$ {
        resolver 8.8.8.8 ipv6=off valid=60s;
        resolver_timeout 10s;

        set $upstream "$proto://$dst_host$dst_path$is_args$args";
        proxy_pass $upstream;

        proxy_set_header Host $dst_host;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_ssl_server_name on;
        proxy_ssl_name $dst_host;
        proxy_ssl_session_reuse on;
    }

    # .well-known proxy for external auth discovery
    location ~ ^/\.well-known/(?<auth>[^/]+)/proxy/(?<proto>https?|wss?):?/?/(?<dst_host>[^/]+)(?<dst_path>/.*)?$ {
        resolver 8.8.8.8 ipv6=off valid=60s;
        resolver_timeout 10s;

        set $upstream "$proto://$dst_host/.well-known/$auth$is_args$args";
        proxy_pass $upstream;

        proxy_set_header Host $dst_host;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_ssl_server_name on;
        proxy_ssl_name $dst_host;
        proxy_ssl_session_reuse on;
    }

    # NOTE: On DO App Platform, volume mounts are not available.
    # The three alias-based file-serving locations from the docker-compose
    # setup (/files/files/, /files/home/jupyter/, /files/runs/) have been
    # removed. All /files/ requests are now proxied to upload-server, which
    # must handle serving files from its own filesystem or external storage
    # (e.g. DO Spaces).

    # File operations proxy -> upload-server (hyphenated name for DO App Platform)
    location /files/ {
        proxy_pass         http://upload-server:9092/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # LangGraph API proxy
    location /graph/ {
        proxy_pass         http://langgraph-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    location /public/ {
        alias /usr/share/nginx/html/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # HTML5 History API support for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
