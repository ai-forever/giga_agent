volumes:
  langgraph-data:
    driver: local
  giga-agent-data:
    driver: local

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      giga-agent:
        condition: service_started
    ports:
      - "8123:80"
    volumes:
      - ./deployments/local/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

  langgraph-redis:
    image: redis:6
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 1s
      retries: 5

  langgraph-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aegra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - langgraph-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 10s
      timeout: 1s
      retries: 5
      interval: 5s

  giga-agent-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - giga-agent-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 10s
      timeout: 1s
      retries: 5
      interval: 5s

  qdrant:
    image: qdrant/qdrant
    volumes:
      - ./qdrant_storage:/qdrant/storage

  giga-agent:
    build:
      context: .
      dockerfile: deployments/local/Dockerfile
    depends_on:
      langgraph-redis:
        condition: service_healthy
      langgraph-postgres:
        condition: service_healthy
      giga-agent-postgres:
        condition: service_healthy
    env_file:
      - ./.env
      - ./backend/.env
    environment:
      HOME: /tmp
      MEM0_DIR: /tmp/.mem0
      AEGRA_CONFIG: /app/config/langgraph.json
      AUTH_TYPE: custom
      GIGA_AGENT_UI_PREFIX: /ui
      REDIS_URI: redis://langgraph-redis:6379
      REDIS_URL: redis://langgraph-redis:6379
      POSTGRES_URI: postgres://postgres:postgres@langgraph-postgres:5432/aegra?sslmode=disable
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@langgraph-postgres:5432/aegra
      GIGA_AGENT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@giga-agent-postgres:5432/postgres
      QDRANT_URL: http://qdrant:6333
      GIGA_AGENT_LANGGRAPH_API_URL: http://giga-agent:8000
      DOCKER_HOST: unix:///var/run/docker.sock
      GIGA_AGENT_PROJECT_ROOT: /.giga_agent
    volumes:
      - ./backend/langgraph.json:/app/config/langgraph.json:ro
      - ./deployments/aegra-startup.sh:/app/deployments/aegra-startup.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.giga_agent:/.giga_agent
    command: ["sh", "/app/deployments/aegra-startup.sh"]

