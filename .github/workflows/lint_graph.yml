name: Lint Graph

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - 'backend/graph/**'
  merge_group:

jobs:
  lint-graph:
    name: Lint Graph
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/graph
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.29"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: uv sync --group lint

      - name: Run lint
        run: make lint

