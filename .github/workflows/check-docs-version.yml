name: Check docs match PyPI package

# Документация в docs-site/ описывает конкретную версию giga-agent из PyPI
# (docs-site/docs-version.json), а не текущий код репозитория. Этот workflow
# скачивает именно эту версию пакета и сверяет с ней ключевые утверждения
# документации. Падение означает: пора обновлять документацию под новый релиз
# либо в документацию закралась ошибка.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/check-docs-version.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/check-docs-version.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read documented version
        id: ver
        run: |
          version=$(python -c "import json; print(json.load(open('docs-site/docs-version.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Документация описывает giga-agent==$version"

      - name: Download documented package from PyPI
        run: |
          mkdir -p _pkg
          pip download "giga-agent==${{ steps.ver.outputs.version }}" \
            --no-deps --only-binary :all: -d _pkg
          python -c "import zipfile, glob; zipfile.ZipFile(glob.glob('_pkg/*.whl')[0]).extractall('_pkg/ext')"

      - name: Check docs contract against package
        run: python docs-site/scripts/check_pypi_contract.py _pkg/ext
