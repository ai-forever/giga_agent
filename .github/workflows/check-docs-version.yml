name: Check docs contracts

# Документация хранит две линии: стабильную версию giga-agent из PyPI
# (docs-site/docs-version.json) и текущую версию main через переключатель версий
# Docusaurus. Этот workflow сверяет стабильные страницы с PyPI, current/main
# страницы с исходниками репозитория, матрицу RU/EN и docs-only ограничения.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/check-docs-version.yml'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/check-docs-version.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Typecheck docs site
        working-directory: docs-site
        run: npm run typecheck

      - name: Read documented version
        id: ver
        run: |
          version=$(python -c "import json; print(json.load(open('docs-site/docs-version.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Документация описывает giga-agent==$version"

      - name: Download documented package from PyPI
        run: |
          mkdir -p _pkg
          pip download "giga-agent==${{ steps.ver.outputs.version }}" \
            --no-deps --only-binary :all: -d _pkg
          python -c "import zipfile, glob; zipfile.ZipFile(glob.glob('_pkg/*.whl')[0]).extractall('_pkg/ext')"

      - name: Check docs contract against package
        run: python docs-site/scripts/check_pypi_contract.py _pkg/ext

      - name: Check current/main docs contract against repository
        run: python docs-site/scripts/check_current_contract.py .

      - name: Check RU/EN and stable/current docs matrix
        run: python docs-site/scripts/check_docs_matrix.py docs-site

      - name: Check docs language quality
        run: python docs-site/scripts/check_docs_quality.py docs-site

      - name: Check non-goals and Pages workflow
        run: python docs-site/scripts/check_non_goals.py .
