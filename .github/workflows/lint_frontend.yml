name: Lint Frontend

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - 'front/src/**'
  merge_group:

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Check Format
        run: npm run format:check

