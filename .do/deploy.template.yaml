spec:
  name: giga-agent
  region: fra
  services:
    - name: langgraph-redis
      image:
        registry_type: DOCKER_HUB
        registry: library
        repository: redis
        tag: "6"
      internal_ports:
        - 6379
      instance_size_slug: apps-s-1vcpu-1gb
    - name: qdrant
      image:
        registry_type: DOCKER_HUB
        registry: qdrant
        repository: qdrant
      internal_ports:
        - 6333
      instance_size_slug: apps-s-1vcpu-1gb
    - name: langgraph-api
      github:
        branch: feature/add-do-integration
        repo: ai-forever/giga_agent
        deploy_on_push: true
      source_dir: backend/graph
      dockerfile_path: backend/graph/Dockerfile
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      internal_ports:
        - 8000
      envs:
        - key: REDIS_URI
          value: "redis://langgraph-redis:6379"
        - key: DATABASE_URL
          value: "postgresql+asyncpg://${aegra-postgres.USERNAME}:${aegra-postgres.PASSWORD}@${aegra-postgres.HOSTNAME}:${aegra-postgres.PORT}/${aegra-postgres.DATABASE}"
        - key: AUTH_TYPE
          value: noop
        - key: JUPYTER_CLIENT_API
          value: "http://repl:9090"
        - key: JUPYTER_UPLOAD_API
          value: "http://upload-server:9092"
        - key: TOOL_CLIENT_API
          value: "http://tool-server:9091"
        - key: LANGGRAPH_API_URL
          value: "http://langgraph-api:8000/"
      run_command: >
        sh -c "
          echo 'Running database migrations...' &&
          uv run alembic upgrade head &&
          echo 'Starting Aegra server...' &&
          uv run uvicorn src.agent_server.main:app --host 0.0.0.0 --port 8000
        "
    - name: repl
      github:
        branch: feature/add-do-integration
        repo: ai-forever/giga_agent
      source_dir: backend/repl
      dockerfile_path: backend/repl/Dockerfile
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      internal_ports:
        - 9090
      run_command: >-
        sh -c "chown -R jupyter:jupyter /home/jupyter /kernel_states /runs &&
        exec su -s /bin/bash -c 'uv run uvicorn app.main:app --host 0.0.0.0 --port 9090' jupyter"
      envs:
        - key: PLOTLY_RENDERER
          value: plotly_mimetype
        - key: MAX_KERNEL_LIVE
          value: "300"
        - key: FILES_DIR
          value: /files
        - key: STATE_DIR
          value: /kernel_states
    - name: upload-server
      github:
        branch: feature/add-do-integration
        repo: ai-forever/giga_agent
        deploy_on_push: true
      source_dir: backend/repl
      dockerfile_path: backend/repl/Dockerfile
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      internal_ports:
        - 9092
      run_command: "uv run uvicorn app.upload_server:app --host 0.0.0.0 --port 9092"
      envs:
        - key: PLOTLY_RENDERER
          value: plotly_mimetype
        - key: MAX_KERNEL_LIVE
          value: "300"
        - key: FILES_DIR
          value: /files
        - key: STATE_DIR
          value: /kernel_states
        - key: GIGA_AGENT_API
          value: "http://giga-agent-server:8822"
    - name: tool-server
      github:
        branch: feature/add-do-integration
        repo: ai-forever/giga_agent
        deploy_on_push: true
      source_dir: backend/graph
      dockerfile_path: backend/graph/Dockerfile
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      internal_ports:
        - 9091
      run_command: "uv run uvicorn giga_agent.tool_server.tool_server:app --host 0.0.0.0 --port 9091"
      envs:
        - key: JUPYTER_CLIENT_API
          value: "http://repl:9090"
        - key: TOOL_CLIENT_API
          value: "http://tool-server:9091"
        - key: JUPYTER_UPLOAD_API
          value: "http://upload-server:9092"
    - name: giga-agent-server
      github:
        branch: feature/add-do-integration
        repo: ai-forever/giga_agent
        deploy_on_push: true
      source_dir: backend/graph
      dockerfile_path: backend/graph/Dockerfile
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      internal_ports:
        - 8822
      run_command: "uv run uvicorn giga_agent.tasks_app:app --host 0.0.0.0 --port 8822"
      envs:
        - key: JUPYTER_CLIENT_API
          value: "http://repl:9090"
        - key: LANGGRAPH_API_URL
          value: "http://langgraph-api:8000/"
    - name: frontend
      github:
        branch: feature/add-do-integration
        repo: ai-forever/giga_agent
        deploy_on_push: true
      source_dir: front
      dockerfile_path: front/Dockerfile.do
      http_port: 80
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      envs:
        - key: VITE_LANGCONNECT_API_URL
          scope: BUILD_TIME
        - key: VITE_LANGCONNECT_API_SECRET_TOKEN
          scope: BUILD_TIME
          type: SECRET
        - key: VITE_MCP_PROXY_URL
          scope: BUILD_TIME
        - key: VITE_MEMORY_ENABLED
          value: "1"
          scope: BUILD_TIME
  envs:
    # GIGA_AGENT SETTINGS
    - key: GIGA_AGENT_LLM
      value: "gigachat:GigaChat-2-Max"
    - key: GIGA_AGENT_LLM_FAST
      value: "gigachat:GigaChat-2-Pro"
    - key: GIGA_AGENT_EMBEDDINGS
      value: "gigachat:EmbeddingsGigaR"
    - key: GIGA_AGENT_SENTIMENT_MODEL
      value: "models/sentiment_gigachat.joblib"
    - key: GIGA_AGENT_LANG
      value: "ru-RU"
    - key: GIGA_AGENT_MCP_CONFIG
      value: "{}"
    - key: GIGA_AGENT_USER_NOTES
      value: ""
    - key: GIGA_AGENT_MEMORY_ENABLED
      value: "1"
    # GIGACHAT SETTINGS
    - key: GIGACHAT_CREDENTIALS
      type: SECRET
    - key: GIGACHAT_SCOPE
      value: "GIGACHAT_API_CORP" # TODO change to PERS later
    - key: GIGACHAT_VERIFY_SSL_CERTS
      value: "0"
    - key: GIGACHAT_TIMEOUT
      value: "60"
    - key: MAIN_GIGACHAT_CREDENTIALS
      type: SECRET
    - key: MAIN_GIGACHAT_SCOPE
      value: "GIGACHAT_API_CORP" # TODO change to PERS later
    - key: MAIN_GIGACHAT_TIMEOUT
      value: "15"
    - key: MAIN_GIGACHAT_TOP_P
      value: "0.5"
    # IMAGE GENERATION
    - key: IMAGE_GEN_NAME
      value: "gigachat:kandinsky-4.1"
    - key: IMAGE_GEN_PARALLEL
      value: "5"
    # FOR ENABLING RAG
    - key: LANGCONNECT_API_URL
    - key: LANGCONNECT_API_SECRET_TOKEN
      type: SECRET
    # FUSION BRAIN
    - key: IMAGE_GEN_NAME
      value: "fusion_brain:123"
    - key: KANDINSKY_API_KEY
      type: SECRET
    - key: KANDINSKY_SECRET_KEY
      type: SECRET
    # SERVICES
    - key: TAVILY_API_KEY
      type: SECRET
    - key: VK_TOKEN
      type: SECRET
    - key: GITHUB_PERSONAL_ACCESS_TOKEN
      type: SECRET
    - key: OWM_API_KEY
      type: SECRET
    - key: TWOGIS_TOKEN
      type: SECRET
    - key: SALUTE_SPEECH
      type: SECRET
    - key: SBER_TTS_TIMEOUT
      value: "30"
    # INTERNAL
    - key: PLOTLY_RENDERER
      value: "plotly_mimetype"
    - key: MAX_KERNEL_LIVE
      value: "300"
    - key: FILES_DIR
      value: "/files"
    - key: RUNS_DIR
      value: "/runs"
    - key: LANGGRAPH_API_URL
      value: "http://langgraph-api:8000/"
    - key: JINA_READER_URL
      value: "https://r.jina.ai/"
    - key: CHARACTER_LIMIT
      value: "100000"
    - key: REPL_FROM_MESSAGE
      value: "0"
  databases:
    - name: aegra-postgres
      engine: PG
      version: "16"
      db_name: postgres
      db_user: postgres
