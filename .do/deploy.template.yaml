spec:
  name: giga-agent
  region: fra
  services:
    - name: langgraph-redis
      image:
        registry_type: DOCKER_HUB
        registry: library
        repository: redis
        tag: 6.2
    - name: giga-agent-graph
      github:
        branch: feature/add-do-integration
        repo: ai-forever/giga_agent
        deploy_on_push: true
      source_dir: backend/graph
      instance_count: 1
      environment_slug: python
      instance_size_slug: apps-s-1vcpu-1gb
    - name: giga-agent-repl
      github:
        branch: feature/add-do-integration
        repo: ai-forever/giga_agent
        deploy_on_push: true
      source_dir: backend/repl
      instance_count: 1
      environment_slug: python
      instance_size_slug: apps-s-1vcpu-1gb
    - name: giga-agent-front
      github:
        branch: feature/add-do-integration
        repo: ai-forever/giga_agent
        deploy_on_push: true
      source_dir: front
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb

  envs:
    - key: GIGACHAT_CREDENTIALS
      type: SECRET
      scope: RUN_TIME
    - key: GIGACHAT_SCOPE
      value: "GIGACHAT_API_PERS"
      scope: RUN_TIME
    - key: MAIN_GIGACHAT_CREDENTIALS
      type: SECRET
      scope: RUN_TIME
    - key: MAIN_GIGACHAT_SCOPE
      value: "GIGACHAT_API_PERS"
      scope: RUN_TIME
  databases:
    - name: db
      engine: PG
      version: "16"