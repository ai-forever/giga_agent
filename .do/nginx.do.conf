# DigitalOcean App Platform: Nginx server block
# Adapted from front/nginx.main.conf for DO App Platform hostnames.
# This file does NOT affect docker-compose deployments.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream;

    client_max_body_size 150M;
    keepalive_timeout 75s;

    # Conditional Connection header for WebSocket upgrade
    set $connection_upgrade "";
    if ($http_upgrade != "") {
        set $connection_upgrade "upgrade";
    }

    # Tasks API (DO component: tasks-api)
    location /api/ {
        proxy_pass         http://tasks-api:8822/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    # MCP proxy (external URLs, uses public DNS resolver)
    location ~ ^/proxy/(?<proto>https?|wss?):?/?/(?<dst_host>[^/]+)(?<dst_path>/.*)?$ {
        resolver 8.8.8.8 ipv6=off valid=60s;
        resolver_timeout 10s;

        set $upstream "$proto://$dst_host$dst_path$is_args$args";
        proxy_pass $upstream;

        proxy_set_header Host $dst_host;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming (SSE, large responses/uploads)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # TLS SNI
        proxy_ssl_server_name on;
        proxy_ssl_name $dst_host;
        proxy_ssl_session_reuse on;
    }

    # .well-known proxy for MCP auth
    location ~ ^/\.well-known/(?<auth>[^/]+)/proxy/(?<proto>https?|wss?):?/?/(?<dst_host>[^/]+)(?<dst_path>/.*)?$ {
        resolver 8.8.8.8 ipv6=off valid=60s;
        resolver_timeout 10s;

        set $upstream "$proto://$dst_host/.well-known/$auth$is_args$args";
        proxy_pass $upstream;

        proxy_set_header Host $dst_host;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # TLS SNI
        proxy_ssl_server_name on;
        proxy_ssl_name $dst_host;
        proxy_ssl_session_reuse on;
    }

    # Serve static files from local filesystem
    location /files/files/ {
          alias /files/;
          try_files $uri =404;
          autoindex off;
          expires 30d;
          add_header Cache-Control "public, max-age=2592000";
    }

    location /files/home/jupyter/ {
          alias /home/jupyter/;
          charset utf-8;
          charset_types text/plain text/csv application/json application/javascript text/css text/html;
          try_files $uri =404;
          autoindex off;
          expires 30d;
          add_header Cache-Control "public, max-age=2592000";
    }

    location /files/runs/ {
          alias /runs/;
          charset utf-8;
          charset_types text/plain text/csv application/json application/javascript text/css text/html;
          try_files $uri =404;
          autoindex off;
          expires 30d;
          add_header Cache-Control "public, max-age=2592000";
    }

    # Upload server (co-located at 127.0.0.1:9092)
    location /files/ {
        proxy_pass         http://127.0.0.1:9092/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # LangGraph/Aegra API (DO component: langgraph-api)
    location /graph/ {
        proxy_pass         http://langgraph-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    location /public/ {
        alias /usr/share/nginx/html/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # HTML5 History API support for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
